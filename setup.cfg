[mutmut]
source_paths =
    app
only_mutate =
    app/runner.py
    app/impact.py
    app/impact_treesitter.py
    app/cli.py
    app/decisions.py
    app/snapshot.py
    app/config.py
    app/adapters/registry.py
also_copy =
    probes
    sample_project
    tools
    tests

# --- Documented exclusions ----------------------------------------------------------
#
# NOTE: `do_not_mutate_patterns` entries are REGEXES matched against source lines, not
# globs. A leading `*` is an invalid regex ("nothing to repeat") and aborts the run.
#
# Excluded lines are not free points. Each entry marks a line whose mutants could only be
# killed by a test that is worse than the mutant: one asserting an internal implementation
# detail (brittle against legitimate refactors, catches no bug) or wall-clock timing
# (flaky under load). A 100% score bought that way would be a vanity metric, and this
# project's rule is that only real process output counts.
#
# Deliberately NOT excluded, because behavioural tests are expected to kill these:
#   - outcome classification (classify)
#   - pytest/framework result parsing (run_suite counts)
#   - probe execution status handling (run_probe_once)
#   - rerun linking and its probe-hash guard (_prior_delta_probes)
#   - the subprocess timeout path is covered by an explicit test instead of excluded

do_not_mutate_patterns =
    # 1. Cosmetic: a truncated digest length has no observable behaviour. The only kill is
    #    asserting len(_sha8(x)) == 16, which pins an implementation detail.
    hexdigest\(\)\[:[0-9]+\]
    # 2. Timing: mutants that drop the subprocess timeout can only be caught by asserting
    #    wall-clock duration.
    timeout=TIMEOUT_S
