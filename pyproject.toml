[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "behavior-review"
version = "0.1.0"
description = "Behavior review before and after a PR: impact graph, paired execution, human decisions."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
  "tree-sitter>=0.26",
  "tree-sitter-language-pack>=1.20",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
multilang = ["tree-sitter>=0.26", "tree-sitter-language-pack>=1.20"]

[project.scripts]
behavior-review = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

# The probe runners ship with the tool, so a reviewed repository doesn't have to copy them.
[tool.setuptools.package-data]
app = ["harness/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
