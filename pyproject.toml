[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "behavior-review"
version = "0.1.0"
description = "Behavior review before and after a PR: impact graph, paired execution, human decisions."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
  "tree-sitter>=0.26",
  "tree-sitter-language-pack>=1.20",
  # `behavior-review ui`: the local web UI's API (LANE_F_PLAN F-F).
  "fastapi>=0.115",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
multilang = ["tree-sitter>=0.26", "tree-sitter-language-pack>=1.20"]

[project.scripts]
behavior-review = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

# The probe runners and the built web page ship with the tool, so a reviewed repository copies nothing
# and users need no Node (web/scripts/copy-to-package.mjs builds app/web_dist).
[tool.setuptools.package-data]
app = ["harness/*", "web_dist/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
