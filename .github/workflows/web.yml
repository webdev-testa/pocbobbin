name: Web

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    name: Web viewer checks and packaged page
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm test
      - run: npm run typecheck

      # `behavior-review ui` serves app/web_dist, committed because git installs build from source.
      - name: The committed app/web_dist matches a fresh build
        run: |
          npm run build:package
          if [ -n "$(git status --porcelain -- ../app/web_dist)" ]; then
            git status --short -- ../app/web_dist
            echo "::error::app/web_dist is stale: run 'npm run build:package' in web/ and commit app/web_dist"
            exit 1
          fi
