name: Behavior Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  behavior-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f pyproject.toml ]; then
            pip install -e . || pip install . || true
          fi
          pip install pydantic pytest pyyaml

      - name: Run Behavior Review
        run: |
          # Execute behavior review against PR base ref
          if command -v behavior-review >/dev/null 2>&1; then
            behavior-review \
              --base "origin/${{ github.base_ref }}" \
              --head HEAD \
              --json report.json
          else
            python -m app.cli \
              --base "origin/${{ github.base_ref }}" \
              --head HEAD \
              --json report.json
          fi

      - name: Upload Review Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: behavior-review-report
          path: report.json
          if-no-files-found: ignore

      - name: Post or Update PR Comment
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const fs = require('fs');
            let body = '';

            if (fs.existsSync('report.md')) {
              body = fs.readFileSync('report.md', 'utf8');
            } else if (fs.existsSync('report.json')) {
              try {
                const data = JSON.parse(fs.readFileSync('report.json', 'utf8'));
                const rev = data.revisions || {};
                const impact = data.impact || {};
                const outside = (impact.paths || []).filter(p => p.outside_diff && !p.is_test);

                const lines = [
                  '## 🔍 Behavior Review Report',
                  '',
                  `**Revisions:** \`${(rev.base_sha || '').slice(0, 7)}\` (${rev.base_ref || 'base'}) → \`${(rev.head_sha || '').slice(0, 7)}\` (${rev.head_ref || 'head'})`,
                  '',
                  '### 📈 Impact Summary',
                  `- **Changed Symbols:** ${(impact.changed_symbols || []).length}`,
                  `- **Impact Paths:** ${(impact.paths || []).length}`,
                  `- **Callers Outside Diff:** ${outside.length}`,
                  `- **Unknowns:** ${(impact.unknowns || []).length}`,
                  ''
                ];

                if (outside.length > 0) {
                  lines.push('### ⚠️ Callers Outside Diff');
                  lines.push('| Caller Symbol | File & Line | Rendered Path |');
                  lines.push('|---|---|---|');
                  for (const p of outside) {
                    const h0 = p.hops && p.hops[0] ? p.hops[0] : {};
                    const renderPath = (p.hops || []).map(h => h.symbol).join(' → ');
                    lines.push(`| \`${h0.symbol || ''}\` | \`${h0.path || ''}:${h0.line || ''}\` | \`${renderPath}\` |`);
                  }
                  lines.push('');
                } else {
                  lines.push('✅ **No non-test callers outside the diff impacted.**\n');
                }

                const comparisons = data.comparisons || [];
                if (comparisons.length > 0) {
                  lines.push('### 🧪 Behavior Comparisons');
                  lines.push('| Probe | Base Output | Head Output | Outcome |');
                  lines.push('|---|---|---|---|');
                  for (const c of comparisons) {
                    const pId = (c.probe && c.probe.id) || 'unknown';
                    const bOut = JSON.stringify(c.base && c.base.output);
                    const hOut = JSON.stringify(c.head && c.head.output);
                    const outcome = c.outcome || 'unknown';
                    lines.push(`| \`${pId}\` | \`${bOut}\` | \`${hOut}\` | \`${outcome}\` |`);
                  }
                  lines.push('');
                }

                const decisions = data.decisions || [];
                if (decisions.length > 0) {
                  lines.push('### 📝 Recorded Decisions');
                  lines.push('| Symbol | Intent | Rationale | Status |');
                  lines.push('|---|---|---|---|');
                  for (const d of decisions) {
                    const sym = (d.target && d.target.symbol) || 'unknown';
                    const intent = d.intent || 'unknown';
                    const rat = d.rationale || '-';
                    const st = d.status || 'proposed';
                    lines.push(`| \`${sym}\` | \`${intent}\` | ${rat} | \`${st}\` |`);
                  }
                  lines.push('');
                }

                const limits = data.limits || [];
                if (limits.length > 0) {
                  lines.push('<details><summary>Operational Limits</summary>\n');
                  for (const l of limits) {
                    lines.push(`- ${l}`);
                  }
                  lines.push('\n</details>\n');
                }

                lines.push('---');
                lines.push('*AI proposes, algorithms verify, humans decide.*');

                body = lines.join('\n');
                fs.writeFileSync('report.md', body, 'utf8');
              } catch (e) {
                body = `### Behavior Review\nError parsing report.json: ${e.message}`;
              }
            } else {
              body = '### Behavior Review\nReview finished without JSON report.';
            }

            const marker = '<!-- behavior-review-comment -->';
            const fullBody = marker + '\n' + body;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: fullBody,
              });
              console.log(`Updated existing comment ${existing.id}`);
            } else {
              const created = await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: fullBody,
              });
              console.log(`Created new comment ${created.data.id}`);
            }
