name: Behavior Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  behavior-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # both revisions must be resolvable as commits
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run behavior review (impact + paired execution + report)
        # Real CLI flags are --base/--head/--json/--run; there is no --format or --out.
        run: |
          python -m app.cli \
            --repo . \
            --base "origin/${{ github.base_ref }}" \
            --head "${{ github.sha }}" \
            --run \
            --json report.json > summary.txt
          cat summary.txt

      - name: Render the PR comment from the real report
        # Every line comes from the executed run: impact paths, frozen suite results,
        # probe outputs. A fixture is never presented as a result.
        run: |
          python - <<'PY'
          import json, pathlib
          report = json.loads(pathlib.Path("report.json").read_text())
          rev, impact = report["revisions"], report["impact"]
          lines = [
              "<!-- behavior-review-comment -->",
              "## Behavior review",
              "",
              f"`{rev['base_sha'][:8]}` -> `{rev['head_sha'][:8]}` · "
              f"{len(impact['changed_symbols'])} changed symbols · "
              f"{len(impact['unknowns'])} unknowns",
              "",
              f"Diff touches: {', '.join('`%s`' % f for f in rev['changed_files']) or '(nothing)'}",
              "",
          ]
          outside = [p for p in impact["paths"] if p["outside_diff"] and not p["is_test"]]
          seen, rows = set(), []
          for p in outside:
              first = p["hops"][0]
              key = (first["path"], first["symbol"], first["line"])
              if key not in seen:
                  seen.add(key)
                  rows.append(" → ".join(h["symbol"] for h in p["hops"])
                              + f" (`{first['path']}:{first['line']}`)")
          if rows:
              lines += ["**Callers outside the diff**", ""] + [f"- {r}" for r in rows] + [""]

          if report["tests"]:
              lines += ["**Frozen test suite (same bytes, both revisions)**", ""]
              lines += [f"- {t['revision']}: {t['status']} ({t['passed']} passed, "
                        f"{t['failed']} failed, {t['errors']} errors)" for t in report["tests"]]
              lines += [""]

          if report["comparisons"]:
              lines += ["**Probes (same bytes, both revisions)**", "",
                        "| probe | outcome | base | head |", "|---|---|---|---|"]
              for c in report["comparisons"]:
                  b = c["base"]["output"] if c["base"]["exception"] is None else c["base"]["exception"]
                  h = c["head"]["output"] if c["head"]["exception"] is None else c["head"]["exception"]
                  lines.append(f"| `{c['probe']['id']}` | **{c['outcome']}** | `{json.dumps(b)}` | `{json.dumps(h)}` |")
              lines += [""]

          if report["needs_bob_action"]:
              lines += ["**Needs Bob action** (impacted callers with no committed probe)", ""]
              lines += [f"- `{r['path']}::{r['symbol']}`" for r in report["needs_bob_action"]]
              lines += [""]

          if report["limits"]:
              lines += ["<details><summary>Limits</summary>", ""]
              lines += [f"- {l}" for l in report["limits"]]
              lines += ["", "</details>", ""]

          pathlib.Path("comment.md").write_text("\n".join(lines))
          PY

      - name: Upload review artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: behavior-review-report
          path: |
            report.json
            comment.md
          if-no-files-found: ignore

      - name: Post or update the PR comment
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- behavior-review-comment -->';
            let body;
            if (fs.existsSync('comment.md')) {
              body = fs.readFileSync('comment.md', 'utf8');
            } else {
              body = marker + '\n## Behavior review\n\nThe review step produced no report. '
                + 'See the job log. This replaces any earlier review comment.';
            }
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
