name: Multi-Language Review & Toolchains CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-multilang:
    name: Verify Multi-Language Adapters & Toolchains
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # 22.6+ for `--experimental-strip-types`, which the TypeScript probe runner (app/harness/run_probe.ts) needs.
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install dependencies with Multi-Language support
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,multilang]"
          pip install pydantic pytest pyyaml

      - name: Run Test Suite (AST, Parsers, Adapters, Runners)
        run: |
          pytest -q tests/test_treesitter.py tests/test_runner_config.py tests/test_config.py tests/test_multilang_e2e.py

      - name: Verify Tree-sitter Language Pack
        run: |
          python -c "from tree_sitter_language_pack import get_language; languages = ['typescript', 'javascript', 'java', 'csharp', 'go', 'cpp', 'c', 'rust', 'php', 'kotlin', 'ruby', 'swift', 'dart', 'bash']; print('Checked languages:', [lang for lang in languages if get_language(lang)])"
